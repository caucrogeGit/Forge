# Configuration de DÉVELOPPEMENT pour la prévisualisation locale (DOC-DEV-SERVE-001).
#
# Hérite de mkdocs.yml et sert le site à la RACINE (http://127.0.0.1:8000/)
# au lieu du préfixe de production /docs/forge/ (issu de `site_url`).
#
# Usage :
#   mkdocs serve -f mkdocs.serve.yml                 # sert sur http://127.0.0.1:8000/
#   mkdocs serve -f mkdocs.serve.yml --dirtyreload   # reconstruit seulement les pages modifiées
#
# NE PAS utiliser pour le build de production : `mkdocs build --strict` reste sur
# mkdocs.yml (qui garde le bon site_url public).
INHERIT: mkdocs.yml
site_url: http://127.0.0.1:8000/
