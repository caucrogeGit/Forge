<div class="mb-4">
    <label class="block text-sm font-medium text-gray-700 mb-1">{{ label | default('') }}</label>
    <input
        type="{{ type | default('text') }}"
        name="{{ name }}"
        value="{{ value | default('') }}"
        class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500{% if error %} border-red-500{% endif %}">
    {% if error %}
    <p class="mt-1 text-sm text-red-600">{{ error }}</p>
    {% endif %}
</div>
