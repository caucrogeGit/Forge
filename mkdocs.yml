site_name: Forge
site_description: Framework web MVC pur Python
site_author: Roger Lequette
site_url: https://forgemvc.com/docs/forge/

repo_name: caucrogeGit/Forge
repo_url: https://github.com/caucrogeGit/Forge
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  favicon: static/favicon.svg
  logo: static/forge-logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - scheme: default
      primary: black
      accent: deep orange

