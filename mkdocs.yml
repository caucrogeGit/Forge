site_name: Forge
site_description: Framework web MVC pur Python
site_author: Roger Lequette
site_url: https://forgemvc.com/docs/forge/

repo_name: caucrogeGit/Forge
repo_url: https://github.com/caucrogeGit/Forge
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  custom_dir: overrides
  favicon: static/favicon.png
  logo: static/forge-logo.png
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tooltips
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - scheme: default
      primary: black
      accent: deep orange

