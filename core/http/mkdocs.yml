# Documentation embarquée du sous-paquet core/http (ADR-043).
# Agrégée dans le site unique forgemvc.com par le plugin mkdocs-monorepo.
# Le site_name sert de préfixe d'URL : les pages sont montées sous /core-http/.
site_name: core-http
docs_dir: docs
nav:
  - Référence HTTP (par module):
      - L'objet Request (request.py): request.md
      - L'objet Response (response.py): response.md
      - Helpers de réponse (helpers.py): helpers.md
      - Le routeur (router.py): router.md
      - Jeton Bearer d'API (bearer.py): bearer.md
      - En-tête Range (byte_range.py): byte_range.md
      - Inspection de debug (debug_dumper.py): debug_dumper.md
      - Slugs d'URL (slug.py): slug.md
