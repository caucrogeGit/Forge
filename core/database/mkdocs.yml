# Documentation embarquée du sous-paquet core/database (ADR-043).
# Agrégée dans le site unique forgemvc.com par le plugin mkdocs-monorepo.
# Le site_name sert de préfixe d'URL : les pages sont montées sous /core-database/.
site_name: core-database
docs_dir: docs
nav:
  - Référence base de données (par module):
      - Helpers SQL (db.py): db.md
      - Transactions (transaction.py): transaction.md
      - Pool de connexions (connection.py): connection.md
      - Chargeur de requêtes SQL (sql_loader.py): sql_loader.md
