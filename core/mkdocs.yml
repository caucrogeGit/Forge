# Documentation embarquée de la racine du paquet core (ADR-043).
# Agrégée dans le site unique forgemvc.com par le plugin mkdocs-monorepo.
# Le site_name sert de préfixe d'URL : les pages sont montées sous /core/.
# Couvre les fichiers à la racine de core/ (hors sous-paquets), à commencer
# par le registre de configuration du noyau (core/forge.py).
site_name: core
docs_dir: docs
nav:
  - Registre de configuration (forge.py): forge_config.md
