# Documentation embarquée du paquet forge-mvc-mssql (ADR-038).
# Agrégée dans le site unique forgemvc.com par le plugin mkdocs-monorepo.
# Le site_name sert de préfixe d'URL : les pages sont montées sous /mssql/.
site_name: mssql
docs_dir: docs
nav:
  - Présentation: index.md
  - Référence: reference.md
  - Progression SQL Server:
      - Installation: welcome/installation.md
      - Débutant:
          - Préparer la base: welcome/debutant/mssql-welcome.md
          - Appliquer une entité: welcome/debutant/mssql-apply.md
          - Bilan débutant: welcome/debutant/bilan.md
      - Intermédiaire:
          - Faire évoluer le schéma: welcome/intermediaire/mssql-migrate.md
          - État du support Alpha: welcome/intermediaire/mssql-status.md
          - Bilan intermédiaire: welcome/intermediaire/bilan.md
      - Avancé:
          - Le dialecte SQL Server: welcome/avance/mssql-dialect.md
          - Valider l'intégration: welcome/avance/mssql-validate.md
          - Bilan avancé: welcome/avance/bilan.md
      - Aide-mémoire: welcome/recapitulatif.md
