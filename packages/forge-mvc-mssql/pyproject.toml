[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-mvc-mssql"
version = "1.0.0rc3"
description = "Forge SQL Server — backend BDD Microsoft SQL Server pour Forge (pyodbc), découvert par le cœur via entry point (ADR-054). Niveau plein : dialecte, provisioning db:init et intégration validés sur serveur réel en CI (ADR-084)."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
authors = [
    { name = "Roger Lequette" },
]
license = "LicenseRef-Forge-Proprietary"
keywords = ["python", "mvc", "forge", "sqlserver", "mssql", "database", "backend"]
dependencies = [
    "forge-mvc>=1.0.0rc3,<2",
    "pyodbc>=5.0,<6",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.entry-points."forge_mvc.db_backend"]
mssql = "forge_mvc_mssql.backend:MSSQLBackend"

[project.urls]
Homepage = "https://github.com/caucrogeGit/Forge"
Repository = "https://github.com/caucrogeGit/Forge"
Documentation = "https://forgemvc.com/docs/forge/"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_mvc_mssql*"]

[tool.setuptools.package-data]
"forge_mvc_mssql" = ["py.typed"]
