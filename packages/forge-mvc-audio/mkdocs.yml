# Documentation embarquée du paquet forge-mvc-audio (ADR-038).
# Agrégée dans le site unique forgemvc.com par le plugin mkdocs-monorepo.
# Le site_name sert de préfixe d'URL : les pages sont montées sous /audio/.
site_name: audio
docs_dir: docs
nav:
  - Référence: reference.md
  - Référence (par module):
      - Configuration (config.py): references/config.md
      - Ingestion (ingest.py): references/ingest.md
      - Sondage (probe.py): references/probe.md
      - Transcodage MP3 (transcode.py): references/transcode.md
      - Lecture HTTP (http.py): references/http.md
  - Progression Audio:
      - Débutant:
          - Bonjour Forge Audio: welcome/debutant/audio-welcome.md
          - Téléverser un audio: welcome/debutant/audio-upload.md
          - Lire un audio: welcome/debutant/audio-play.md
          - Bilan débutant: welcome/debutant/bilan.md
      - Avancé:
          - Sonder un audio: welcome/avance/audio-probe.md
          - Transcoder en MP3: welcome/avance/audio-transcode.md
          - Diagnostiquer le module Audio: welcome/avance/audio-doctor.md
          - Bilan avancé: welcome/avance/bilan.md
      - Aide-mémoire: welcome/recapitulatif.md
