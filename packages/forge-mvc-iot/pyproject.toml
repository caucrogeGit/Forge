[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-mvc-iot"
version = "1.0.0rc7"
description = "Forge IoT — module opt-in pour la réception et l'exposition de données IoT : subscriber MQTT, stockage iot_events, API HTTP JSON en lecture seule et commandes CLI forge iot:*."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
authors = [
    { name = "Roger Lequette" },
]
license = "LicenseRef-Forge-Proprietary"
keywords = ["python", "mvc", "forge", "iot", "mqtt"]
dependencies = [
    "forge-mvc>=1.0.0rc7,<2",
    "paho-mqtt>=2.1,<3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# ADR-059 : les commandes CLI de l'opt-in sont déclarées ici et découvertes par
# le cœur (dispatch_optin), sans aucune entrée dans forge.py.
[project.entry-points."forge_mvc.commands"]
forge_mvc_iot = "forge_mvc_iot.commands:COMMANDS"

[project.urls]
Homepage = "https://github.com/caucrogeGit/Forge"
Repository = "https://github.com/caucrogeGit/Forge"
Documentation = "https://forgemvc.com/docs/forge/iot/architecture/"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_mvc_iot*"]

[tool.setuptools.package-data]
forge_mvc_iot = [
    "py.typed",
]
