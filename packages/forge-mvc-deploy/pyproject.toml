[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-mvc-deploy"
version = "1.0.0rc1"
description = "Forge Deploy — outillage de déploiement opt-in : forge deploy:init (wsgi.py, Nginx, systemd) et forge deploy:check, CLI-only, sans API runtime."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
authors = [
    { name = "Roger Lequette" },
]
license = "LicenseRef-Forge-Proprietary"
keywords = ["python", "mvc", "forge", "deploy", "deployment", "gunicorn", "nginx", "systemd"]
dependencies = [
    "forge-mvc>=1.0.0rc1,<2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# ADR-059 : commandes CLI de l'opt-in decouvertes par le coeur (dispatch_optin).
[project.entry-points."forge_mvc.commands"]
forge_mvc_deploy = "forge_mvc_deploy.commands:COMMANDS"

[project.urls]
Homepage = "https://github.com/caucrogeGit/Forge"
Repository = "https://github.com/caucrogeGit/Forge"
Documentation = "https://forgemvc.com/docs/forge/"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_mvc_deploy*"]

[tool.setuptools.package-data]
"forge_mvc_deploy" = ["py.typed"]
