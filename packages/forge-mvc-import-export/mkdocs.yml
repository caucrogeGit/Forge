# Documentation embarquée du paquet forge-mvc-import-export (ADR-038).
# Agrégée dans le site unique forgemvc.com par le plugin mkdocs-monorepo.
# Le site_name sert de préfixe d'URL : les pages sont montées sous /import-export/.
site_name: import-export
docs_dir: docs
nav:
  - Présentation: index.md
  - Référence: reference.md
  - Référence (par module):
      - Lecture CSV (csv_reader.py): references/csv.md
      - Moteur d'import (engine.py): references/engine.md
      - Export programmatique (csv_writer.py): references/export.md
      - Erreurs (errors.py): references/errors.md
  - Progression Import/Export:
      - Installation: welcome/installation.md
      - Débutant:
          - Lire un CSV: welcome/debutant/import-welcome.md
          - Détails de la lecture: welcome/debutant/import-read.md
          - Bilan débutant: welcome/debutant/bilan.md
      - Intermédiaire:
          - Valider et insérer: welcome/intermediaire/import-validate.md
          - Convertir les valeurs: welcome/intermediaire/import-coerce.md
          - Bilan intermédiaire: welcome/intermediaire/bilan.md
      - Avancé:
          - Tout ou rien, ou partiel: welcome/avance/import-partial.md
          - Export programmatique: welcome/avance/export-tocsv.md
          - Indépendance du cœur: welcome/avance/import-independance.md
          - Bilan avancé: welcome/avance/bilan.md
      - Aide-mémoire: welcome/recapitulatif.md
