# Documentation embarquée du paquet forge-mvc-import-export (ADR-038).
# Agrégée dans le site unique forgemvc.com par le plugin mkdocs-monorepo.
# Le site_name sert de préfixe d'URL : les pages sont montées sous /import-export/.
site_name: import-export
docs_dir: docs
nav:
  - Présentation: index.md
  - Référence (par module):
      - Lecture CSV (csv_reader.py): references/csv.md
      - Moteur d'import (engine.py): references/engine.md
      - Export programmatique (csv_writer.py): references/export.md
      - Erreurs (errors.py): references/errors.md
