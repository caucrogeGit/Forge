[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-mvc-import-export"
version = "1.0.0rc1"
description = "Forge Import/Export — échange CSV opt-in : import (lecture, validation par champ, rapport d'erreurs) et export programmatique (to_csv), dans le style Forge."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
authors = [
    { name = "Roger Lequette" },
]
license = "LicenseRef-Forge-Proprietary"
keywords = ["python", "mvc", "forge", "import", "csv", "data"]
dependencies = [
    "forge-mvc>=1.0.0rc1,<2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/caucrogeGit/Forge"
Repository = "https://github.com/caucrogeGit/Forge"
Documentation = "https://forgemvc.com/docs/forge/"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_mvc_import_export*"]

[tool.setuptools.package-data]
"forge_mvc_import_export" = ["py.typed"]
