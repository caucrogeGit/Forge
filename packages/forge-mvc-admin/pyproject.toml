[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-mvc-admin"
version = "1.0.0rc2"
description = "Forge Admin — back-office applicatif opt-in : CRUD générique sur les entités déclarées, sécurité par défaut (auth + CSRF), RBAC optionnel, commandes admin:init / admin:doctor."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
authors = [
    { name = "Roger Lequette" },
]
license = "LicenseRef-Forge-Proprietary"
keywords = ["python", "mvc", "forge", "admin", "back-office"]
dependencies = [
    "forge-mvc>=1.0.0rc2,<2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# ADR-059 : commandes CLI de l'opt-in decouvertes par le coeur (dispatch_optin).
[project.entry-points."forge_mvc.commands"]
forge_mvc_admin = "forge_mvc_admin.commands:COMMANDS"

[project.urls]
Homepage = "https://github.com/caucrogeGit/Forge"
Repository = "https://github.com/caucrogeGit/Forge"
Documentation = "https://forgemvc.com/docs/forge/"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_mvc_admin*"]

[tool.setuptools.package-data]
"forge_mvc_admin" = ["py.typed", "templates/**/*.html"]
