[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-mvc-mariadb"
version = "1.0.0rc4"
description = "Forge MariaDB — backend BDD MariaDB pour Forge : pool de connexions, découvert par le cœur via entry point (ADR-054)."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
authors = [
    { name = "Roger Lequette" },
]
license = "LicenseRef-Forge-Proprietary"
keywords = ["python", "mvc", "forge", "mariadb", "database", "backend"]
dependencies = [
    "forge-mvc>=1.0.0rc4,<2",
    "mariadb>=1.1.14,<1.2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.entry-points."forge_mvc.db_backend"]
mariadb = "forge_mvc_mariadb.backend:MariaDBBackend"

[project.urls]
Homepage = "https://github.com/caucrogeGit/Forge"
Repository = "https://github.com/caucrogeGit/Forge"
Documentation = "https://forgemvc.com/docs/forge/"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_mvc_mariadb*"]

[tool.setuptools.package-data]
"forge_mvc_mariadb" = ["py.typed"]
