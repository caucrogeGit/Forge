[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-mvc-mail"
version = "1.0.0rc7"
description = "Forge mail — composition d'emails, transports interchangeables, templates Jinja et CLI mail:*."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
authors = [
    { name = "Roger Lequette" },
]
license = "LicenseRef-Forge-Proprietary"
keywords = ["python", "mvc", "forge", "mail", "email", "smtp"]
dependencies = [
    "forge-mvc>=1.0.0rc7,<2",
    "jinja2>=3.1,<4",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# ADR-059 : commandes CLI de l'opt-in decouvertes par le coeur (dispatch_optin).
[project.entry-points."forge_mvc.commands"]
forge_mvc_mail = "forge_mvc_mail.commands:COMMANDS"

[project.urls]
Homepage = "https://github.com/caucrogeGit/Forge"
Repository = "https://github.com/caucrogeGit/Forge"
Documentation = "https://forgemvc.com/docs/forge/"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_mvc_mail*"]

[tool.setuptools.package-data]
"forge_mvc_mail" = ["py.typed"]
