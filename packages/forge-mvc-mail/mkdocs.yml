# Documentation embarquée du paquet forge-mvc-mail (ADR-038).
# Agrégée dans le site unique forgemvc.com par le plugin mkdocs-monorepo.
# Le site_name sert de préfixe d'URL : les pages sont montées sous /mail/.
site_name: mail
docs_dir: docs
nav:
  - Référence: reference.md
  - Référence (par module):
      - Configuration (config.py): references/config.md
      - Message (message.py): references/message.md
      - Transports (transports.py): references/transports.md
      - Mailer (mailer.py): references/mailer.md
      - Rendu de gabarits (templates.py): references/templates.md
      - Journal des envois (log.py): references/log.md
      - Erreurs (exceptions.py): references/exceptions.md
  - Progression Mail:
      - Débutant:
          - Bonjour Forge Mail: welcome/debutant/mail-welcome.md
          - Composer un message: welcome/debutant/mail-message.md
          - Bilan débutant: welcome/debutant/bilan.md
      - Intermédiaire:
          - Choisir un transport: welcome/intermediaire/mail-transport.md
          - Rendre un template: welcome/intermediaire/mail-template.md
          - Bilan intermédiaire: welcome/intermediaire/bilan.md
      - Avancé:
          - Configurer l'envoi: welcome/avance/mail-config.md
          - Diagnostiquer le module Mail: welcome/avance/mail-doctor.md
          - Bilan avancé: welcome/avance/bilan.md
      - Aide-mémoire: welcome/recapitulatif.md
