# Documentation embarquée du paquet forge-mvc-testing (ADR-038).
# Agrégée dans le site unique forgemvc.com par le plugin mkdocs-monorepo.
# Le site_name sert de préfixe d'URL : les pages sont montées sous /testing/.
site_name: testing
docs_dir: docs
nav:
  - Présentation: index.md
  - Référence: reference.md
  - Progression Testing:
      - Débutant:
          - Premier test: welcome/debutant/testing-welcome.md
          - Corps et JSON: welcome/debutant/testing-body.md
          - Bilan débutant: welcome/debutant/bilan.md
      - Intermédiaire:
          - Fixtures et isolation: welcome/intermediaire/testing-fixtures.md
          - Tester un contrôleur: welcome/intermediaire/testing-controller.md
          - Bilan intermédiaire: welcome/intermediaire/bilan.md
      - Avancé:
          - Tester un opt-in: welcome/avance/testing-optin.md
          - Pourquoi dev-only: welcome/avance/testing-devonly.md
          - Bilan avancé: welcome/avance/bilan.md
      - Aide-mémoire: welcome/recapitulatif.md
