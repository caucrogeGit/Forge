# Documentation embarquée du paquet forge-mvc-postgres (ADR-038).
# Agrégée dans le site unique forgemvc.com par le plugin mkdocs-monorepo.
# Le site_name sert de préfixe d'URL : les pages sont montées sous /postgres/.
site_name: postgres
docs_dir: docs
nav:
  - Présentation: index.md
  - Référence: reference.md
  - Progression PostgreSQL:
      - Débutant:
          - Préparer la base: welcome/debutant/postgres-welcome.md
          - Appliquer une entité: welcome/debutant/postgres-apply.md
          - Bilan débutant: welcome/debutant/bilan.md
      - Intermédiaire:
          - Faire évoluer le schéma: welcome/intermediaire/postgres-migrate.md
          - État du support Alpha: welcome/intermediaire/postgres-status.md
          - Bilan intermédiaire: welcome/intermediaire/bilan.md
      - Avancé:
          - Le dialecte PostgreSQL: welcome/avance/postgres-dialect.md
          - Valider l'intégration: welcome/avance/postgres-validate.md
          - Bilan avancé: welcome/avance/bilan.md
      - Aide-mémoire: welcome/recapitulatif.md
