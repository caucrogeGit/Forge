[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-mvc-entities"
version = "1.0.0rc2"
description = "Forge entities — moteur de generation et de modelisation d'entites et de relations (make:entity, make:relation, build:model, migrations, make:crud, provisioning db:*), extrait du coeur (ADR-070)."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
authors = [
    { name = "Roger Lequette" },
]
license = "LicenseRef-Forge-Proprietary"
keywords = ["python", "mvc", "forge", "entities", "relations", "codegen", "orm"]
dependencies = [
    "forge-mvc>=1.0.0rc2,<2",
    "jsonschema>=4.18,<5",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/caucrogeGit/Forge"
Repository = "https://github.com/caucrogeGit/Forge"
Documentation = "https://forgemvc.com/docs/forge/"

# Commandes CLI découvertes par le cœur (ADR-059/070) : le moteur d'entités
# n'est plus câblé en dur dans forge.py, il est gaté sur son installation.
[project.entry-points."forge_mvc.commands"]
forge_mvc_entities = "forge_mvc_entities.commands:COMMANDS"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_mvc_entities*"]

[tool.setuptools.package-data]
"forge_mvc_entities" = ["py.typed", "schemas/*.json"]
