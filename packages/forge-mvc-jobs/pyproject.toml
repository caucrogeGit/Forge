[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-mvc-jobs"
version = "1.0.0rc1"
description = "Forge Jobs — file de tâches de fond opt-in adossée à MariaDB : enqueue depuis une requête, worker explicite (drain/run_worker), sans broker ni async."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
authors = [
    { name = "Roger Lequette" },
]
license = "LicenseRef-Forge-Proprietary"
keywords = ["python", "mvc", "forge", "jobs", "queue", "worker", "mariadb"]
dependencies = [
    "forge-mvc>=1.0.0rc1,<2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/caucrogeGit/Forge"
Repository = "https://github.com/caucrogeGit/Forge"
Documentation = "https://forgemvc.com/docs/forge/"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_mvc_jobs*"]

[tool.setuptools.package-data]
"forge_mvc_jobs" = ["py.typed", "migrations/*.sql"]
