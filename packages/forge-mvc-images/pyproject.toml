[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-mvc-images"
version = "1.0.0b16"
description = "Forge Images — module opt-in propriétaire de tout le traitement d'image (variantes, miniatures, validation de contenu, Pillow) et de la couche médias applicative (repository, galerie, couverture)."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
authors = [
    { name = "Roger Lequette" },
]
license = "LicenseRef-Forge-Proprietary"
keywords = ["python", "mvc", "forge", "images", "pillow", "uploads", "gallery"]
dependencies = [
    "forge-mvc>=1.0.0b16,<2",
    "Pillow>=10.0,<13",
    # FILES-IMAGES-REPOINT-001 (ADR-019) : le traitement d'image réutilise le
    # pipeline d'upload générique, désormais détenu par forge-mvc-files.
    "forge-mvc-files>=1.0.0b16,<2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/caucrogeGit/Forge"
Repository = "https://github.com/caucrogeGit/Forge"
Documentation = "https://forgemvc.com/docs/forge/"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_mvc_images*"]

[tool.setuptools.package-data]
"forge_mvc_images" = ["py.typed"]
