# Documentation embarquée du paquet forge-mvc-fixtures (ADR-038).
# Agrégée dans le site unique forgemvc.com par le plugin mkdocs-monorepo.
# Le site_name sert de préfixe d'URL : les pages sont montées sous /fixtures/.
site_name: fixtures
docs_dir: docs
nav:
  - Présentation: index.md
  - Référence: reference.md
  - Référence (par module):
      - Commandes fixtures:* (cli/): references/cli.md
  - Progression Fixtures:
      - Débutant:
          - Bonjour les fixtures: welcome/debutant/fixtures-welcome.md
          - Charger une fixture: welcome/debutant/fixtures-load.md
          - Bilan débutant: welcome/debutant/bilan.md
      - Intermédiaire:
          - Repartir d'un état propre: welcome/intermediaire/fixtures-purge.md
          - Cadrer par environnement: welcome/intermediaire/fixtures-env.md
          - Bilan intermédiaire: welcome/intermediaire/bilan.md
      - Avancé:
          - Fixtures ou migration de seed: welcome/avance/fixtures-vs-seed.md
          - Un opt-in CLI-only: welcome/avance/fixtures-optin.md
          - Bilan avancé: welcome/avance/bilan.md
      - Aide-mémoire: welcome/recapitulatif.md
