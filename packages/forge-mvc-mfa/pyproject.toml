[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-mvc-mfa"
version = "1.0.0b5"
description = "Brique MFA pour Forge — TOTP et codes de récupération."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
authors = [
    { name = "Roger Cauchon" },
]
license = "LicenseRef-Forge-Proprietary"
keywords = ["python", "mvc", "forge", "mfa", "totp"]
dependencies = [
    "forge-mvc==1.0.0b5",
    "pyotp>=2.9,<3",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/caucrogeGit/Forge"
Repository = "https://github.com/caucrogeGit/Forge"
Documentation = "https://caucrogegit.github.io/Forge/"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_mvc_mfa*"]
