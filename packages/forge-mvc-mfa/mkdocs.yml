# Documentation embarquée du paquet forge-mvc-mfa (ADR-038).
# Agrégée dans le site unique forgemvc.com par le plugin mkdocs-monorepo.
# Le site_name sert de préfixe d'URL : les pages sont montées sous /mfa/.
site_name: mfa
docs_dir: docs
nav:
  - Référence Auth MFA: reference.md
  - Progression MFA:
      - Installation: welcome/installation.md
      - Débutant:
          - Bonjour Forge MFA: welcome/debutant/mfa-welcome.md
          - Secret TOTP et QR: welcome/debutant/mfa-secret.md
          - Vérifier un code TOTP: welcome/debutant/mfa-verify.md
          - Bilan débutant: welcome/debutant/bilan.md
      - Intermédiaire:
          - Enrôler un facteur TOTP: welcome/intermediaire/mfa-enroll.md
          - Challenge de connexion: welcome/intermediaire/mfa-challenge.md
          - Codes de récupération: welcome/intermediaire/mfa-recovery.md
          - Bilan intermédiaire: welcome/intermediaire/bilan.md
      - Avancé:
          - Revalidation (step-up): welcome/avance/mfa-revalidation.md
          - Anti-rejeu TOTP: welcome/avance/mfa-replay.md
          - Secret chiffré au repos: welcome/avance/mfa-crypto.md
          - Bilan avancé: welcome/avance/bilan.md
      - Aide-mémoire: welcome/recapitulatif.md
