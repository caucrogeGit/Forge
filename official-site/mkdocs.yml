site_name: Forge
site_description: Site officiel du framework web Python Forge
site_author: Roger Lequette
site_url: https://forgemvc.com/docs/

repo_name: caucrogeGit/Forge-official-site
repo_url: https://github.com/caucrogeGit/Forge-official-site
edit_uri: ""

theme:
