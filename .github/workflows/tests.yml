name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmariadb-dev pkg-config

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt

      # CI-AUDIT-BLOCKING-001 / CI-PYRIGHT-ORDER-001 :
      # pip-audit, ruff et pyright sont en `continue-on-error` (avec `id`) pour
      # qu'ils ne masquent JAMAIS l'exécution de la suite pytest (piège ADR-044).
      # Un « Quality gate » final (if: always) fait échouer le job si l'un d'eux
      # a échoué : ils restent donc bloquants, mais sans masquer le reste.

      - name: Audit dépendances Python (pip-audit)
        id: pipaudit
        continue-on-error: true
        run: pip-audit --ignore-vuln PYSEC-2026-217 -r requirements-audit.txt

      - name: Ruff
        id: ruff
        continue-on-error: true
        run: ruff check .

      - name: Type check (pyright)
        id: pyright
        continue-on-error: true
        run: pyright

      - name: Run tests
        run: python -m pytest -m "not db"

      - name: Purge tooling caches before build
        # PKG-WHEEL-NO-CACHE-001 — `ruff check .` crée skeleton/data/.ruff_cache
        # (le squelette a sa propre config ruff) ; avec include-package-data=true
        # ce cache fuirait dans la wheel. On le purge avant tout build.
        run: |
          find . -type d \( -name .ruff_cache -o -name .pytest_cache -o -name .mypy_cache \) \
            -exec rm -rf {} + 2>/dev/null || true

      - name: Build package
        run: python -m build --no-isolation

      - name: Build optional distributions
        run: |
          for pkg in packages/*/; do
            [ -f "${pkg}pyproject.toml" ] || continue
            python -m build --no-isolation "$pkg"
          done

      - name: Build documentation
        run: mkdocs build --strict

      - name: SAST (bandit, informatif, non bloquant)
        continue-on-error: true
        run: bandit -q -ll -r core packages

      - name: Quality gate (pip-audit + ruff + pyright)
        if: always()
        run: |
          fail=0
          if [ "${{ steps.pipaudit.outcome }}" = "failure" ]; then echo "::error::pip-audit a signale une vulnerabilite"; fail=1; fi
          if [ "${{ steps.ruff.outcome }}" = "failure" ]; then echo "::error::ruff a echoue"; fail=1; fi
          if [ "${{ steps.pyright.outcome }}" = "failure" ]; then echo "::error::pyright a echoue"; fail=1; fi
          exit $fail

  tests-db:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: forge_test_root
          MARIADB_DATABASE: forge_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmariadb-dev pkg-config

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt

      - name: Run DB integration tests (real MariaDB)
        env:
          FORGE_REQUIRE_DB: "1"
          FORGE_TEST_DB_HOST: 127.0.0.1
          FORGE_TEST_DB_PORT: "3306"
          FORGE_TEST_DB_USER: root
          FORGE_TEST_DB_PASSWORD: forge_test_root
          FORGE_TEST_DB_NAME: forge_test
        run: python -m pytest -m db -v

  # CI-DB-POSTGRES-001 (ADR-084) : la suite `db_pg` s'exécute contre un vrai
  # PostgreSQL — premier critère CI de la promotion du backend Alpha.
  tests-db-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: forge_test_pg
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmariadb-dev pkg-config

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
          python -m pip install "psycopg[binary]>=3.1,<4"

      - name: Run DB integration tests (real PostgreSQL)
        env:
          FORGE_REQUIRE_DB_PG: "1"
          FORGE_TEST_PG_HOST: 127.0.0.1
          FORGE_TEST_PG_PORT: "5432"
          FORGE_TEST_PG_USER: postgres
          FORGE_TEST_PG_PASSWORD: forge_test_pg
          FORGE_TEST_PG_NAME: forge_test
        run: python -m pytest -m db_pg -v

  # CI-DB-MSSQL-001 (ADR-084) : la suite `db_mssql` s'exécute contre un vrai
  # SQL Server — premier critère CI de la promotion du backend Alpha.
  tests-db-mssql:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Forge#Test#2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Forge#Test#2026' -C -Q 'SELECT 1' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies (ODBC Driver 18)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmariadb-dev pkg-config unixodbc-dev curl
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl -sSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
          python -m pip install "pyodbc>=5.0,<6"

      - name: Run DB integration tests (real SQL Server)
        env:
          FORGE_REQUIRE_DB_MSSQL: "1"
          FORGE_TEST_MSSQL_HOST: 127.0.0.1
          FORGE_TEST_MSSQL_PORT: "1433"
          FORGE_TEST_MSSQL_USER: sa
          FORGE_TEST_MSSQL_PASSWORD: "Forge#Test#2026"
          FORGE_TEST_MSSQL_NAME: forge_test
        run: python -m pytest -m db_mssql -v
