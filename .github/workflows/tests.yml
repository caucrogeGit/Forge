name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmariadb-dev pkg-config

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Build package
        run: python -m build --no-isolation

      - name: Build optional distributions
        run: |
          for pkg in packages/forge-mvc-mfa packages/forge-mvc-rbac packages/forge-mvc-workflow packages/forge-mvc-stats packages/forge-mvc-media packages/forge-mvc-images packages/forge-mvc-iot packages/forge-mvc-video packages/forge-mvc-audio; do
            python -m build --no-isolation "$pkg"
          done

      - name: Build documentation
        run: mkdocs build --strict
