name: Dependency Audit

# Rôle — DEPENDENCY-AUDIT-RELEASE-GUARD-001 :
# Workflow d'observation HEBDOMADAIRE — NON BLOQUANT par conception.
# `continue-on-error: true` sur les steps pip-audit permet de continuer à
# voir tous les rapports même quand une CVE transitoire apparaît sur une
# dépendance non encore corrigée upstream.
#
# Le GARDE RELEASE est posé séparément dans `tools/release-validate.sh`
# (sections « Audit dépendances Python » et « Audit dépendances Node »),
# où les mêmes commandes `pip-audit` sont BLOQUANTES — aucune publication
# ne peut être validée tant que les audits ne sont pas verts.
#
# Voir `docs/release/release-policy.md#audits-dependances` pour la politique
# complète.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # CI-DEPAUDIT-SYSTEM-DEPS-001 : `requirements-audit.txt` couvre la surface
      # expédiée, dont `mariadb`, distribué en source seule. Sans
      # `mariadb_config`, pip échoue à en lire les métadonnées et pip-audit
      # s'arrête avant d'auditer quoi que ce soit. Même pas que `tests.yml`.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmariadb-dev pkg-config

      - name: Install pip-audit
        run: python -m pip install pip-audit>=2.0

      - name: Audit runtime dependencies (informatif — non bloquant)
        continue-on-error: true
        run: pip-audit -r requirements.txt

      - name: Audit surface expédiée, cœur + opt-ins (informatif — non bloquant)
        continue-on-error: true
        run: pip-audit -r requirements-audit.txt

      - name: Audit dev dependencies (informatif — non bloquant)
        continue-on-error: true
        run: pip-audit -r requirements-dev.txt

      # Seule étape BLOQUANTE de ce workflow, et elle ne signale pas une
      # vulnérabilité : elle signale qu'un avis qu'on a choisi d'IGNORER a
      # désormais un correctif amont. Sans elle, un `--ignore-vuln` survit à la
      # publication du correctif et masque une vulnérabilité réparable.
      - name: Un avis ignoré a-t-il un correctif ? (bloquant)
        run: python tools/check_ignored_vulns.py requirements-audit.txt
