name: Deploy forgemvc.com (forge-web VM)

# Publication du site officiel sur la VM forge-web (ADR-045).
#
# Déclenchement MANUEL uniquement (workflow_dispatch). Exécute la machinerie
# rapatriée official-site/scripts/sync-forge-docs-and-deploy.sh :
# import local de la doc Forge -> build du site -> validations -> rsync vers la
# VM (backup daté, staging vérifié, bascule contrôlée).
#
# PRÉREQUIS RÉSEAU : la VM forge-web est sur une IP privée (LAN). Un runner
# GitHub hébergé ne peut pas l'atteindre : ce workflow doit tourner sur un
# **runner self-hosted** sur le réseau de la VM (label `forge-web`). À défaut,
# utiliser le script local depuis un poste du réseau :
#   DRY_RUN=0 bash official-site/scripts/sync-forge-docs-and-deploy.sh
#
# SECRETS attendus :
#   FORGE_WEB_SSH_KEY     : clé privée SSH autorisée sur la VM
#   FORGE_WEB_HOST        : cible SSH, ex. roger@192.168.1.98
#   FORGE_WEB_KNOWN_HOSTS : sortie de `ssh-keyscan <hôte>`

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (1 = aperçu sans écrire sur la VM)"
        required: true
        default: "1"

concurrency:
  group: deploy-forge-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, forge-web]
    environment: forge-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r official-site/requirements-docs.txt

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.FORGE_WEB_SSH_KEY }}" > ~/.ssh/forge_web_key
          chmod 600 ~/.ssh/forge_web_key
          echo "${{ secrets.FORGE_WEB_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync & deploy
        working-directory: official-site
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run }}" \
          REMOTE_HOST="${{ secrets.FORGE_WEB_HOST }}" \
          GIT_SSH_COMMAND="ssh -i ~/.ssh/forge_web_key" \
          bash scripts/sync-forge-docs-and-deploy.sh

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/forge_web_key
