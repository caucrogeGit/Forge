# Documentation embarquée du sous-paquet cli/security (ADR-043).
# Agrégée dans le site unique forgemvc.com par le plugin mkdocs-monorepo.
# Le site_name sert de préfixe d'URL : les pages sont montées sous /cli-security/.
site_name: cli-security
docs_dir: docs
nav:
  - Référence CLI sécurité (par module):
      - Commandes auth:* (auth.py): auth.md
      - Commande make:auth (make_auth.py): make_auth.md
