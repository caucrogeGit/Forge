# Documentation embarquée du sous-paquet cli/optins (ADR-043).
# Agrégée dans le site unique forgemvc.com par le plugin mkdocs-monorepo.
# Le site_name sert de préfixe d'URL : les pages sont montées sous /cli-optins/.
site_name: cli-optins
docs_dir: docs
nav:
  - Référence CLI opt-ins (par module):
      - Catalogue des opt-ins (catalog.py): catalog.md
      - Conseils d'activation (guidance.py): guidance.md
      - Commande opt-in:install (install.py): install.md
      - Commande opt-in:remove (remove.py): remove.md
      - Commande opt-in:enable (enable.py): enable.md
      - Commande opt-in:disable (disable.py): disable.md
      - Commande opt-in:list (list.py): list.md
