# Documentation embarquée du sous-paquet cli/entities/crud (ADR-043).
# Agrégée dans le site unique forgemvc.com par le plugin mkdocs-monorepo.
# Le site_name sert de préfixe d'URL : les pages sont montées sous /cli-crud/.
site_name: cli-crud
docs_dir: docs
nav:
  - Référence CLI générateur CRUD (par module):
      - Contexte du générateur (context.py): context.md
      - Builder de contrôleur (controller_builder.py): controller_builder.md
      - Builder de modèle (model_builder.py): model_builder.md
      - Builder de formulaire (form_builder.py): form_builder.md
      - Builders de vues (views_builder.py): views_builder.md
      - Chargeur de relations (relations_loader.py): relations_loader.md
      - Helpers de champs (utils.py): utils.md
