# Documentation embarquée du sous-paquet cli/_support (ADR-043).
# Agrégée dans le site unique forgemvc.com par le plugin mkdocs-monorepo.
# Le site_name sert de préfixe d'URL : les pages sont montées sous /cli-support/.
site_name: cli-support
docs_dir: docs
nav:
  - Référence CLI _support (par module):
      - Formatage de sortie (output.py): output.md
      - Erreurs CLI (errors.py): errors.md
      - Aide générale (help.py): help.md
      - Aide par commande (help_dispatch.py): help_dispatch.md
