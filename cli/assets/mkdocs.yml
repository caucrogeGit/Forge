# Documentation embarquée du sous-paquet cli/assets (ADR-043).
# Agrégée dans le site unique forgemvc.com par le plugin mkdocs-monorepo.
# Le site_name sert de préfixe d'URL : les pages sont montées sous /cli-assets/.
site_name: cli-assets
docs_dir: docs
nav:
  - Référence CLI ressources (par module):
      - Commande js:init (front.py): front.md
      - Commandes i18n (i18n.py): i18n.md
      - Commande sync:landing (sync_landing.py): sync_landing.md
      - Commandes upload:init / media:init (uploads.py): uploads.md
