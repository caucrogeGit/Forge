{% if message %}
<div class="px-4 py-3 rounded mb-4 border
    {%- if type == 'success' %} bg-green-100 border-green-400 text-green-800
    {%- elif type == 'error' or type == 'danger' %} bg-red-100 border-red-400 text-red-800
    {%- elif type == 'warning' %} bg-yellow-100 border-yellow-400 text-yellow-800
    {%- else %} bg-blue-100 border-blue-400 text-blue-800
    {%- endif %}">
    {{ message }}
</div>
{% endif %}
