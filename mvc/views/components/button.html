{%- if href is defined and href %}
<a href="{{ href }}"
   class="inline-block px-4 py-2 rounded font-medium
       {%- if variant == 'danger' %} bg-red-600 text-white hover:bg-red-700
       {%- elif variant == 'secondary' %} bg-gray-100 text-gray-800 hover:bg-gray-200
       {%- else %} bg-blue-600 text-white hover:bg-blue-700
       {%- endif %}">
    {{ label | default('') }}
</a>
{%- else %}
<button
    type="{{ type | default('button') }}"
    class="px-4 py-2 rounded font-medium
        {%- if variant == 'danger' %} bg-red-600 text-white hover:bg-red-700
        {%- elif variant == 'secondary' %} bg-gray-100 text-gray-800 hover:bg-gray-200
        {%- else %} bg-blue-600 text-white hover:bg-blue-700
        {%- endif %}">
    {{ label | default('') }}
</button>
{%- endif %}
