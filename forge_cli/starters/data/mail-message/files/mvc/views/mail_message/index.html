{% extends "layouts/app.html" %}
{% block content %}
<h1>Composer un message</h1>
<p>Un <code>MailMessage</code> a ete compose (sans envoi) :</p>
<ul>
  <li>Sujet : {{ subject }}</li>
  <li>Destinataire : {{ to }}</li>
  <li>Copie : {{ cc }}</li>
  <li>Version HTML : {{ "oui" if has_html else "non" }}</li>
</ul>
{% endblock %}
