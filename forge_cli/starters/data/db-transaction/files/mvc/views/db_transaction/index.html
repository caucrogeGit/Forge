<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Écritures transactionnelles — Forge</title>
</head>
<body>
  <h1>Écritures transactionnelles</h1>

  {% if error %}
  <p data-level="error"><strong>{{ error }}</strong></p>
  {% endif %}

  <form method="post" action="/db-transaction">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Premier message <input type="text" name="message_a"></label>
    <label>Second message <input type="text" name="message_b"></label>
    <button type="submit">Enregistrer les deux</button>
  </form>

  <h2>Messages enregistrés</h2>
  {% if messages %}
  <ul>
    {% for m in messages %}
    <li>#{{ m.id }} — {{ m.content }}</li>
    {% endfor %}
  </ul>
  {% else %}
  <p>Aucun message.</p>
  {% endif %}
</body>
</html>
