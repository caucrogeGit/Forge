<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Paginer une liste — Forge</title>
</head>
<body>
  <h1>Messages — page {{ page }}</h1>

  {% if messages %}
  <ul>
    {% for m in messages %}
    <li>#{{ m.id }} — {{ m.content }}</li>
    {% endfor %}
  </ul>
  {% else %}
  <p>Aucun message sur cette page.</p>
  {% endif %}

  <nav>
    {% if has_prev %}<a href="/pagination?page={{ page - 1 }}">← Précédent</a>{% endif %}
    {% if has_next %}<a href="/pagination?page={{ page + 1 }}">Suivant →</a>{% endif %}
  </nav>
</body>
</html>
