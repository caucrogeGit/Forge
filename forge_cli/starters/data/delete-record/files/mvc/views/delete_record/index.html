<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Supprimer un enregistrement — Forge</title>
</head>
<body>
  <h1>Messages</h1>

  {% if deleted %}<p><strong>Message supprimé.</strong></p>{% endif %}

  <ul>
    {% for m in messages %}
    <li>
      #{{ m.id }} — {{ m.content }}
      <form method="post" action="/delete-record/{{ m.id }}" style="display:inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit">supprimer</button>
      </form>
    </li>
    {% endfor %}
  </ul>
</body>
</html>
