[pytest]
testpaths = tests packages
# `--dist loadfile` : sous `-n`, les tests d'un même fichier restent sur le même
# worker (`TEST-DB-WORKER-ISOLATION-001`). Plusieurs fichiers d'intégration sont
# des **scénarios** : une étape crée la table, une autre la lit, une dernière la
# jette. La répartition par défaut les éparpille, si bien que l'étape de lecture
# pouvait s'exécuter sur un worker où la table n'avait jamais été créée, ou venait
# d'être jetée. Mesuré sur les deux scénarios E2E MariaDB : 2 à 4 échecs sur 19 à
# chaque passage en répartition par défaut, aucun en `loadfile`.
#
# Le drapeau est sans effet quand `-n` n'est pas employé, donc sans effet en CI,
# qui n'y recourt pas. Il protège la boucle locale, où la suite entière se lance
# en parallèle.
addopts = --strict-markers --dist loadfile
markers =
    meta: test de cohérence projet (doc, version, charte) — pas un test fonctionnel du framework
    smoke: test de fumée d'un paquet opt-in (import, API publique, py.typed) — autovérifie le paquet publié
    db: test d'intégration nécessitant une vraie base (sauté en local sans base, requis en CI via FORGE_REQUIRE_DB=1 ; MariaDB sauf marqueur de backend combiné)
    db_pg: test d'intégration nécessitant un vrai PostgreSQL (combiné à db ; requis en CI via FORGE_REQUIRE_DB_PG=1 ; le job MariaDB l'exclut par -m "db and not db_pg and not db_mssql")
    db_mssql: test d'intégration nécessitant un vrai SQL Server (combiné à db ; requis en CI via FORGE_REQUIRE_DB_MSSQL=1 ; le job MariaDB l'exclut par -m "db and not db_pg and not db_mssql")
    docs: test de prose pure, ne casse que par édition de la documentation (docs/, mkdocs.yml, CHANGELOG, README, landing) ; boucle code = -m "not docs" (TESTS-DOCS-MARKER-001)
filterwarnings =
    ignore:core\.security\.session\.:DeprecationWarning
