[pytest]
testpaths = tests packages
addopts = --strict-markers
markers =
    meta: test de cohérence projet (doc, version, charte) — pas un test fonctionnel du framework
    smoke: test de fumée d'un paquet opt-in (import, API publique, py.typed) — autovérifie le paquet publié
    db: test d'intégration nécessitant une vraie base (sauté en local sans base, requis en CI via FORGE_REQUIRE_DB=1 ; MariaDB sauf marqueur de backend combiné)
    db_pg: test d'intégration nécessitant un vrai PostgreSQL (combiné à db ; requis en CI via FORGE_REQUIRE_DB_PG=1)
    db_mssql: test d'intégration nécessitant un vrai SQL Server (combiné à db ; requis en CI via FORGE_REQUIRE_DB_MSSQL=1)
    docs: test de prose pure, ne casse que par édition de la documentation (docs/, mkdocs.yml, CHANGELOG, README, landing) ; boucle code = -m "not docs" (TESTS-DOCS-MARKER-001)
filterwarnings =
    ignore:core\.security\.session\.:DeprecationWarning
