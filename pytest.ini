[pytest]
testpaths = tests packages
markers =
    meta: test de cohérence projet (doc, version, charte) — pas un test fonctionnel du framework
    smoke: test de fumée d'un paquet opt-in (import, API publique, py.typed) — autovérifie le paquet publié
    db: test d'intégration nécessitant une vraie MariaDB (sauté en local sans base, requis en CI via FORGE_REQUIRE_DB=1)
filterwarnings =
    ignore:core\.security\.session\.:DeprecationWarning
