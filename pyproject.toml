[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-mvc"
version = "1.0.0b17"
description = "Framework web applicatif Python minimaliste, pédagogique et extensible."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"

authors = [
    { name = "Roger Lequette" },
]

license = "LicenseRef-Forge-Proprietary"
license-files = ["LICENSE"]

keywords = ["python", "mvc", "framework", "web", "education", "forge"]

dependencies = [
    "mariadb==1.1.14",
    "python-dotenv==1.2.2",
    "jinja2==3.1.6",
    # CORE-DROP-PILLOW-001 (ADR-018) : Pillow a quitté le core. Le traitement
    # d'image vit dans l'opt-in forge-mvc-images, qui déclare Pillow lui-même.
    "argon2-cffi>=25.1,<26",
    "jsonschema>=4.18",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/caucrogeGit/Forge"
Repository = "https://github.com/caucrogeGit/Forge"
Documentation = "https://forgemvc.com/docs/forge/"
Issues = "https://github.com/caucrogeGit/Forge/issues"

# Extras de raccourci vers les opt-ins publiables stables (rbac/workflow/stats).
# Pins alignés sur la version courante : forge-mvc-<nom>>=1.0.0b17,<2
# (politique unifiée OPTIN-DEPS-PIN-B13-001).
# Exclus de [all] : forge-mvc-mfa, forge-mvc-images, forge-mvc-iot, forge-mvc-video
#   images = traitement d'image (Pillow), API applicative encore Alpha
#   mfa   = Alpha (secret TOTP chiffré au repos)
#   iot   = Alpha + dépendance MQTT (paho-mqtt)
#   video = Alpha + binaire système FFmpeg
# Ces quatre opt-ins s'installent explicitement (pip install --pre forge-mvc-<nom>).
# Donc `forge-mvc[all]` ≠ « tous les opt-ins publiés » : il cible le socle
# stable rbac/workflow/stats sans tirer de dépendances Alpha/MQTT/FFmpeg.

[project.optional-dependencies]
rbac = ["forge-mvc-rbac>=1.0.0b17,<2"]
workflow = ["forge-mvc-workflow>=1.0.0b17,<2"]
stats = ["forge-mvc-stats>=1.0.0b17,<2"]
all = [
    "forge-mvc-rbac>=1.0.0b17,<2",
    "forge-mvc-workflow>=1.0.0b17,<2",
    "forge-mvc-stats>=1.0.0b17,<2",
]

[project.scripts]
forge = "forge:cli_entrypoint"

[tool.setuptools]
py-modules = ["forge"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "cli*", "integrations*"]

[tool.setuptools.package-data]
"cli" = [
    "skeleton/data/**/*",
    "skeleton/data/**/.*",
    "skeleton/data/.*",
    "skeleton/data/.*/**/*",   # fichiers DANS les dossiers dot (.vscode/…),
]
# PEP 561 : expose les types du cœur aux projets utilisateurs (ADR-036).
"core" = ["py.typed"]

[tool.setuptools.exclude-package-data]
# PKG-WHEEL-NO-PYC-001 — exclusion globale du bytecode compilé : avec
# include-package-data, tout __pycache__ présent dans l'arbre au moment
# du build remonterait sinon dans la wheel (artefact non reproductible).
"*" = [
    "**/__pycache__/*",
    "**/*.pyc",
    "**/*.pyo",
]
"cli" = [
    "skeleton/data/**/__pycache__/*",
    "skeleton/data/**/*.pyc",
    "skeleton/data/**/*.pyo",
]

[tool.pyright]
# ADR-036 — typage statique vérifié en CI. Le cliquet couvre désormais le cœur
# ET les 12 opt-ins, tous `# pyright: strict` par fichier (0 erreur en mode
# "standard" + marqueurs). `extraPaths` rend chaque paquet importable par les
# autres (images→files, video→files, etc.) : pyright ne suit pas les installs
# éditables PEP 660, on lui donne donc les sources directement.
include = [
    "core",
    "packages/forge-mvc-admin/forge_mvc_admin",
    "packages/forge-mvc-audio/forge_mvc_audio",
    "packages/forge-mvc-files/forge_mvc_files",
    "packages/forge-mvc-i18n/forge_mvc_i18n",
    "packages/forge-mvc-images/forge_mvc_images",
    "packages/forge-mvc-iot/forge_mvc_iot",
    "packages/forge-mvc-mail/forge_mvc_mail",
    "packages/forge-mvc-mfa/forge_mvc_mfa",
    "packages/forge-mvc-pivot/forge_mvc_pivot",
    "packages/forge-mvc-rbac/forge_mvc_rbac",
    "packages/forge-mvc-settings/forge_mvc_settings",
    "packages/forge-mvc-stats/forge_mvc_stats",
    "packages/forge-mvc-video/forge_mvc_video",
    "packages/forge-mvc-workflow/forge_mvc_workflow",
]
extraPaths = [
    "packages/forge-mvc-admin",
    "packages/forge-mvc-audio",
    "packages/forge-mvc-files",
    "packages/forge-mvc-i18n",
    "packages/forge-mvc-images",
    "packages/forge-mvc-iot",
    "packages/forge-mvc-mail",
    "packages/forge-mvc-mfa",
    "packages/forge-mvc-pivot",
    "packages/forge-mvc-rbac",
    "packages/forge-mvc-settings",
    "packages/forge-mvc-stats",
    "packages/forge-mvc-video",
    "packages/forge-mvc-workflow",
]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["cmd/", ".venv/", "site/", "packages/core", "packages/cli", "packages/integrations"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",  # line-too-long — géré séparément
    "E741",  # ambiguous-variable-name — intentionnel dans les boucles et générateurs
    "E402",  # module-import-not-at-top — intentionnel dans app.py et scripts
]
