[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-mvc"
version = "1.0.0rc6"
description = "Framework web applicatif Python minimaliste, pédagogique et extensible."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"

authors = [
    { name = "Roger Lequette" },
]

license = "LicenseRef-Forge-Proprietary"
license-files = ["LICENSE"]

keywords = ["python", "mvc", "framework", "web", "education", "forge"]

dependencies = [
    "python-dotenv==1.2.2",
    "jinja2==3.1.6",
    # CORE-DROP-PILLOW-001 (ADR-018) : Pillow a quitté le core. Le traitement
    # d'image vit dans l'opt-in forge-mvc-images, qui déclare Pillow lui-même.
        "argon2-cffi>=25.1,<26",
    # CORE-DROP-JSONSCHEMA-001 (ADR-070) : jsonschema a quitté le core avec le
    # moteur d'entités. forge-mvc-entities et forge-mvc-rbac le déclarent eux-mêmes.
    # Les commandes du core (schema:list, schema:doctor) n'inspectent que présence,
    # validité JSON et $ref, sans jsonschema.
]


classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/caucrogeGit/Forge"
Repository = "https://github.com/caucrogeGit/Forge"
Documentation = "https://forgemvc.com/docs/forge/"
Issues = "https://github.com/caucrogeGit/Forge/issues"

# Extras de raccourci vers les opt-ins publiables stables (rbac/workflow/stats).
# Pins alignés sur la version courante : forge-mvc-<nom>>=1.0.0rc6,<2
# (politique unifiée OPTIN-DEPS-PIN-B13-001).
# Exclus de [all] : forge-mvc-mfa, forge-mvc-images, forge-mvc-iot, forge-mvc-video
#   images = traitement d'image (Pillow), API applicative encore Alpha
#   mfa   = Alpha (secret TOTP chiffré au repos)
#   iot   = Alpha + dépendance MQTT (paho-mqtt)
#   video = Alpha + binaire système FFmpeg
# Ces quatre opt-ins s'installent explicitement (pip install --pre forge-mvc-<nom>).
# Donc `forge-mvc[all]` ≠ « tous les opt-ins publiés » : il cible le socle
# stable rbac/workflow/stats sans tirer de dépendances Alpha/MQTT/FFmpeg.

[project.optional-dependencies]
rbac = ["forge-mvc-rbac>=1.0.0rc6,<2"]
workflow = ["forge-mvc-workflow>=1.0.0rc6,<2"]
stats = ["forge-mvc-stats>=1.0.0rc6,<2"]
all = [
    # Périmètre restreint aux 3 opt-ins sans dépendance lourde ni binaire
    # système : « all » = base recommandée, pas la totalité des opt-ins.
    # Les autres s'installent explicitement (rationale détaillée : README).
    "forge-mvc-rbac>=1.0.0rc6,<2",
    "forge-mvc-workflow>=1.0.0rc6,<2",
    "forge-mvc-stats>=1.0.0rc6,<2",
]

[project.scripts]
forge = "forge:cli_entrypoint"

[tool.setuptools]
py-modules = ["forge"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "cli*", "integrations*", "skeleton*"]

[tool.setuptools.package-data]
# Le squelette matérialisé par `forge new` est la donnée du paquet `skeleton`
# (paquet racine, ADR-065). Globs relatifs au paquet.
"skeleton" = [
    "data/**/*",
    "data/**/.*",
    "data/.*",
    "data/.*/**/*",   # fichiers DANS les dossiers dot (.vscode/…),
]
# PEP 561 : expose les types du cœur aux projets utilisateurs (ADR-036).
"core" = ["py.typed"]

[tool.setuptools.exclude-package-data]
# PKG-WHEEL-NO-PYC-001 — exclusion globale du bytecode compilé : avec
# include-package-data, tout __pycache__ présent dans l'arbre au moment
# du build remonterait sinon dans la wheel (artefact non reproductible).
"*" = [
    "**/__pycache__/*",
    "**/*.pyc",
    "**/*.pyo",
]
"skeleton" = [
    "data/**/__pycache__/*",
    "data/**/*.pyc",
    "data/**/*.pyo",
]

[tool.pyright]
# ADR-036 - typage statique vérifié en CI. Le cliquet couvre le cœur, tous les
# opt-ins et les 4 backends BDD (ADR-054), en `# pyright: strict` par fichier.
# `forge-mvc-testing` (dev-only, ADR-041) est inclus mais vérifié en mode
# "standard" seulement (annotation stricte complète à faire séparément). `extraPaths` rend chaque paquet importable par les
# autres (images→files, video→files, etc.) : pyright ne suit pas les installs
# éditables PEP 660, on lui donne donc les sources directement.
include = [
    "core",
    "packages/forge-mvc-admin/forge_mvc_admin",
    "packages/forge-mvc-audio/forge_mvc_audio",
    "packages/forge-mvc-audit/forge_mvc_audit",
    "packages/forge-mvc-deploy/forge_mvc_deploy",
    "packages/forge-mvc-entities/forge_mvc_entities",
    "packages/forge-mvc-files/forge_mvc_files",
    "packages/forge-mvc-i18n/forge_mvc_i18n",
    "packages/forge-mvc-images/forge_mvc_images",
    "packages/forge-mvc-import-export/forge_mvc_import_export",
    "packages/forge-mvc-iot/forge_mvc_iot",
    "packages/forge-mvc-jobs/forge_mvc_jobs",
    "packages/forge-mvc-mail/forge_mvc_mail",
    "packages/forge-mvc-mfa/forge_mvc_mfa",
    "packages/forge-mvc-notifications/forge_mvc_notifications",
    "packages/forge-mvc-rbac/forge_mvc_rbac",
    "packages/forge-mvc-qrcode/forge_mvc_qrcode",
    "packages/forge-mvc-sessions-db/forge_mvc_sessions_db",
    "packages/forge-mvc-settings/forge_mvc_settings",
    "packages/forge-mvc-stats/forge_mvc_stats",
    "packages/forge-mvc-video/forge_mvc_video",
    "packages/forge-mvc-workflow/forge_mvc_workflow",
    "packages/forge-mvc-mariadb/forge_mvc_mariadb",
    "packages/forge-mvc-mssql/forge_mvc_mssql",
    "packages/forge-mvc-postgres/forge_mvc_postgres",
    "packages/forge-mvc-sqlite/forge_mvc_sqlite",
    "packages/forge-mvc-testing/forge_mvc_testing",
]
extraPaths = [
    "packages/forge-mvc-admin",
    "packages/forge-mvc-audio",
    "packages/forge-mvc-audit",
    "packages/forge-mvc-deploy",
    "packages/forge-mvc-entities",
    "packages/forge-mvc-files",
    "packages/forge-mvc-i18n",
    "packages/forge-mvc-images",
    "packages/forge-mvc-import-export",
    "packages/forge-mvc-iot",
    "packages/forge-mvc-jobs",
    "packages/forge-mvc-mail",
    "packages/forge-mvc-mfa",
    "packages/forge-mvc-notifications",
    "packages/forge-mvc-rbac",
    "packages/forge-mvc-qrcode",
    "packages/forge-mvc-sessions-db",
    "packages/forge-mvc-settings",
    "packages/forge-mvc-stats",
    "packages/forge-mvc-video",
    "packages/forge-mvc-workflow",
    "packages/forge-mvc-mariadb",
    "packages/forge-mvc-mssql",
    "packages/forge-mvc-postgres",
    "packages/forge-mvc-sqlite",
    "packages/forge-mvc-testing",
]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["cmd/", ".venv/", "site/"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",  # line-too-long — géré séparément
    "E741",  # ambiguous-variable-name — intentionnel dans les boucles et générateurs
    "E402",  # module-import-not-at-top — intentionnel dans app.py et scripts
]
